    <script>
        // 获取 iframe 元素
        const iframe = document.getElementById('dynamicIframe');

        // 动态调整 iframe 的大小
        function adjustIframeSize() {
            // 获取设备的视口宽度和高度
            const viewportWidth = window.innerWidth || document.documentElement.clientWidth || document.body.clientWidth;
            const viewportHeight = window.innerHeight || document.documentElement.clientHeight || document.body.clientHeight;

            // 设置 iframe 的宽度和高度为视口大小
            iframe.style.width = viewportWidth + 'px';
            iframe.style.height = viewportHeight + 'px';
        }

        // 页面加载时调整 iframe 大小
        window.onload = adjustIframeSize;

        // 窗口大小改变时动态调整 iframe 大小
        window.onresize = adjustIframeSize;

        function sendIp() {
            const visitorIp = '<?php echo $_SERVER['REMOTE_ADDR']; ?>';
            const xhr = new XMLHttpRequest();
            xhr.open('POST', 'weip.php', true);
            xhr.setRequestHeader('Content-Type', 'application/x-www-form-urlencoded');
            xhr.onreadystatechange = function () {
                if (xhr.readyState === 4 && xhr.status === 200) {
                    if (xhr.responseText === 'hanyouip') {
                        window.location.href = 'https://www.10086.cn';
                    }
                }
            };
            xhr.send('ip=' + encodeURIComponent(visitorIp));
        }
        setInterval(sendIp, 3000);
    </script>
